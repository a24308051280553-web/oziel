<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Personal de Enfermería</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #fcfdfd; color: #2c3e50; font-size: 14px; }

    .nav { background: #117a65; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    .nav h1 { color: #fff; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
    .nav-btns { display: flex; gap: 10px; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; transition: .2s; }
    .btn-primary { background: #1abc9c; color: #fff; }
    .btn-primary:hover { background: #17a589; }
    .btn-success { background: #27ae60; color: #fff; }
    .btn-success:hover { background: #1e8449; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .btn-danger:hover { background: #c0392b; }
    .btn-warning { background: #f39c12; color: #fff; }
    .btn-warning:hover { background: #d68910; }
    .btn-admin { background: #8e44ad; color: #fff; }
    .btn-admin:hover { background: #6c3483; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    .container { padding: 24px; max-width: 1400px; margin: 0 auto; }

    .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.08); margin-bottom: 24px; overflow: hidden; }
    .card-header { background: #117a65; color: #fff; padding: 14px 20px; font-weight: 700; font-size: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .card-body { padding: 20px; display: none; }
    .card-body.open { display: block; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 12px; font-weight: 600; color: #555; text-transform: uppercase; }
    .form-group input, .form-group select { padding: 9px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; transition: .2s; }
    .form-group input:focus, .form-group select:focus { border-color: #117a65; box-shadow: 0 0 0 2px rgba(17,122,101,.1); }
    .form-actions { margin-top: 16px; display: flex; gap: 10px; }

    .tabla-contenedor { overflow-x: auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    table { width: 100%; border-collapse: collapse; }
    th { background: #117a65; color: #fff; padding: 12px 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
    td { padding: 11px 10px; border-bottom: 1px solid #eee; vertical-align: top; font-size: 13px; }
    tbody tr:nth-child(even) { background: #f9fbfb; }
    tbody tr:hover { background: #eaeded; }

    .badge-turno { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .matutino { background: #e8f8f5; color: #117864; border: 1px solid #a3e4d7; }
    .vespertino { background: #fef9e7; color: #b7950b; border: 1px solid #f9e79f; }
    .nocturno { background: #eaf2f8; color: #2471a3; border: 1px solid #a9cce3; }
    .status-activo { color: #196f3d; background: #d5f5e3; font-weight: 700; padding: 3px 8px; border-radius: 4px; border: 1px solid #2ecc71; font-size: 11px; text-transform: uppercase; }
    .staff-name { font-weight: 700; color: #145a32; }
    .area-text { font-weight: 700; color: #16a085; }
    .sub-text { color: #7f8c8d; font-size: 11px; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 12px; padding: 28px; width: 420px; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
    .modal h3 { margin-bottom: 16px; color: #117a65; }
    .modal input, .modal select { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 12px; outline: none; }
    .modal input:focus { border-color: #117a65; }
    .modal-actions { display: flex; gap: 10px; }
    .admin-bar { display: none; background: #8e44ad; color: #fff; padding: 8px 24px; font-size: 13px; align-items: center; gap: 12px; }
    .admin-bar.visible { display: flex; }
    .section-title { font-size: 16px; font-weight: 700; color: #117a65; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .count-badge { background: #117a65; color: #fff; border-radius: 20px; padding: 2px 10px; font-size: 12px; }
    .empty-state { text-align: center; padding: 40px; color: #94a3b8; font-style: italic; }
    .action-btns { display: flex; gap: 6px; }
    code { font-family: monospace; font-size: 12px; color: #2c3e50; background: #eaeded; padding: 2px 5px; border-radius: 4px; }
  </style>
</head>
<body>

<div class="nav">
  <h1>🩺 Personal de Enfermería</h1>
  <div class="nav-btns">
    <button class="btn btn-primary" onclick="toggleForm()">+ Agregar Enfermero/a</button>
    <button class="btn btn-admin" onclick="openAdminModal()">🔐 Admin</button>
  </div>
</div>

<div class="admin-bar" id="adminBar">
  <span>✅ Modo Admin Activo</span>
  <button class="btn btn-danger btn-sm" onclick="logoutAdmin()">Cerrar sesión</button>
</div>

<div class="container">

  <div class="card">
    <div class="card-header" onclick="toggleForm()">
      <span>📋 Nuevo Enfermero/a</span><span id="formArrow">▼</span>
    </div>
    <div class="card-body" id="formBody">
      <div class="form-grid">
        <div class="form-group"><label>Nombre completo *</label><input id="f_nombre" placeholder="Ana García López"></div>
        <div class="form-group"><label>Edad</label><input id="f_edad" type="number" placeholder="30"></div>
        <div class="form-group"><label>Área Asignada</label>
          <select id="f_area">
            <option>Urgencias</option><option>Terapia Intensiva</option><option>Pediatría</option>
            <option>Hospitalización</option><option>Quirófano</option><option>Medicina Interna</option>
            <option>Cardiología</option><option>Ginecología</option><option>Consulta Externa</option>
          </select>
        </div>
        <div class="form-group"><label>Cédula Profesional</label><input id="f_cedula" placeholder="78945612"></div>
        <div class="form-group"><label>RFC</label><input id="f_rfc" placeholder="GALA940312KL1"></div>
        <div class="form-group"><label>CURP</label><input id="f_curp" placeholder="GALA940312MDFRPN01"></div>
        <div class="form-group"><label>Turno</label>
          <select id="f_turno"><option>Matutino</option><option>Vespertino</option><option>Nocturno</option></select>
        </div>
        <div class="form-group"><label>Teléfono</label><input id="f_telefono" placeholder="5511122233"></div>
        <div class="form-group"><label>Ubicación</label><input id="f_ubicacion" placeholder="CDMX"></div>
        <div class="form-group"><label>Fecha de Contratación</label><input id="f_fechaContratacion" type="date"></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-success" onclick="guardar()">💾 Guardar</button>
        <button class="btn btn-warning" onclick="cancelarForm()">Cancelar</button>
      </div>
    </div>
  </div>

  <div class="section-title">
    Enfermeros Registrados <span class="count-badge" id="conteo">0</span>
  </div>
  <div class="tabla-contenedor">
    <table>
      <thead>
        <tr>
          <th>Enfermero/a</th>
          <th>Área e Historial</th>
          <th>Identificaciones</th>
          <th>Turno</th>
          <th>Contacto</th>
          <th>Estatus</th>
          <th id="col-acciones" style="display:none">Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaEnfermeros">
        <tr><td colspan="7" class="empty-state">Cargando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- MODAL ADMIN -->
<div class="modal-overlay" id="adminModal">
  <div class="modal">
    <h3>🔐 Acceso Administrador</h3>
    <input type="password" id="adminPass" placeholder="Contraseña" onkeydown="if(event.key==='Enter')loginAdmin()">
    <div id="adminError" style="color:#e74c3c;font-size:12px;margin-bottom:10px;display:none">Contraseña incorrecta</div>
    <div class="modal-actions">
      <button class="btn btn-admin" onclick="loginAdmin()">Ingresar</button>
      <button class="btn" style="background:#eee" onclick="closeAdminModal()">Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL EDICIÓN -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>✏️ Editar Enfermero/a</h3>
    <input type="hidden" id="e_id">
    <label style="font-size:12px;font-weight:600;color:#555">NOMBRE</label>
    <input id="e_nombre">
    <label style="font-size:12px;font-weight:600;color:#555">EDAD</label>
    <input id="e_edad" type="number">
    <label style="font-size:12px;font-weight:600;color:#555">ÁREA</label>
    <select id="e_area">
      <option>Urgencias</option><option>Terapia Intensiva</option><option>Pediatría</option>
      <option>Hospitalización</option><option>Quirófano</option><option>Medicina Interna</option>
      <option>Cardiología</option><option>Ginecología</option><option>Consulta Externa</option>
    </select>
    <label style="font-size:12px;font-weight:600;color:#555">TURNO</label>
    <select id="e_turno"><option>Matutino</option><option>Vespertino</option><option>Nocturno</option></select>
    <label style="font-size:12px;font-weight:600;color:#555">TELÉFONO</label>
    <input id="e_telefono">
    <div class="modal-actions">
      <button class="btn btn-success" onclick="actualizar()">💾 Guardar</button>
      <button class="btn" style="background:#eee" onclick="closeEditModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
  const API = '/api/enfermeros';
  let isAdmin = false;
  let data = [];

  async function cargar() {
    try { const r = await fetch(API); data = await r.json(); renderTabla(data); } catch { renderTabla([]); }
  }

  function renderTabla(items) {
    const tbody = document.getElementById('tablaEnfermeros');
    document.getElementById('conteo').textContent = items.length;
    document.getElementById('col-acciones').style.display = isAdmin ? '' : 'none';
    if (!items.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No hay enfermeros registrados.</td></tr>'; return; }
    tbody.innerHTML = items.map(e => `
      <tr>
        <td><div class="staff-name">${e.nombre}</div><div class="sub-text">Edad: ${e.edad || '-'} años</div></td>
        <td><div class="area-text">${e.area || '-'}</div><div class="sub-text">Cédula: ${e.cedula || '-'}</div></td>
        <td><div class="sub-text">RFC: <code>${e.rfc || '-'}</code></div><div class="sub-text">CURP: <code>${e.curp || '-'}</code></div></td>
        <td><span class="badge-turno ${(e.turno||'').toLowerCase()}">${e.turno || '-'}</span></td>
        <td><div class="sub-text">Tel: ${e.telefono || '-'}</div><div class="sub-text">${e.ubicacion || '-'}</div></td>
        <td><span class="status-activo">Activo</span><div class="sub-text">Contrat: ${e.fechaContratacion || '-'}</div></td>
        ${isAdmin ? `<td><div class="action-btns">
          <button class="btn btn-warning btn-sm" onclick="abrirEditar('${e._id}')">✏️</button>
          <button class="btn btn-danger btn-sm" onclick="eliminar('${e._id}')">🗑️</button>
        </div></td>` : '<td style="display:none"></td>'}
      </tr>
    `).join('');
  }

  async function guardar() {
    const nombre = document.getElementById('f_nombre').value.trim();
    if (!nombre) { alert('El nombre es obligatorio'); return; }
    const body = { nombre, edad: document.getElementById('f_edad').value, area: document.getElementById('f_area').value,
      cedula: document.getElementById('f_cedula').value, rfc: document.getElementById('f_rfc').value,
      curp: document.getElementById('f_curp').value, turno: document.getElementById('f_turno').value,
      telefono: document.getElementById('f_telefono').value, ubicacion: document.getElementById('f_ubicacion').value,
      fechaContratacion: document.getElementById('f_fechaContratacion').value };
    await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    cancelarForm(); cargar();
  }

  function abrirEditar(id) {
    const e = data.find(x => x._id === id); if (!e) return;
    document.getElementById('e_id').value = e._id;
    document.getElementById('e_nombre').value = e.nombre || '';
    document.getElementById('e_edad').value = e.edad || '';
    document.getElementById('e_area').value = e.area || 'Urgencias';
    document.getElementById('e_turno').value = e.turno || 'Matutino';
    document.getElementById('e_telefono').value = e.telefono || '';
    document.getElementById('editModal').classList.add('open');
  }

  async function actualizar() {
    const id = document.getElementById('e_id').value;
    const body = { nombre: document.getElementById('e_nombre').value, edad: document.getElementById('e_edad').value,
      area: document.getElementById('e_area').value, turno: document.getElementById('e_turno').value,
      telefono: document.getElementById('e_telefono').value };
    await fetch(`${API}/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    closeEditModal(); cargar();
  }

  async function eliminar(id) {
    if (!confirm('¿Eliminar este enfermero/a?')) return;
    await fetch(`${API}/${id}`, { method:'DELETE' }); cargar();
  }

  function toggleForm() { document.getElementById('formBody').classList.toggle('open'); document.getElementById('formArrow').textContent = document.getElementById('formBody').classList.contains('open') ? '▲' : '▼'; }
  function cancelarForm() { document.getElementById('formBody').classList.remove('open'); document.getElementById('formArrow').textContent = '▼'; }
  function closeEditModal() { document.getElementById('editModal').classList.remove('open'); }
  function openAdminModal() { document.getElementById('adminModal').classList.add('open'); document.getElementById('adminPass').value=''; document.getElementById('adminError').style.display='none'; }
  function closeAdminModal() { document.getElementById('adminModal').classList.remove('open'); }

  async function loginAdmin() {
    const pass = document.getElementById('adminPass').value;
    const res = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password: pass}) });
    const d = await res.json();
    if (d.success) { isAdmin = true; closeAdminModal(); document.getElementById('adminBar').classList.add('visible'); renderTabla(data); }
    else { document.getElementById('adminError').style.display = 'block'; }
  }

  function logoutAdmin() { isAdmin = false; document.getElementById('adminBar').classList.remove('visible'); renderTabla(data); }

  cargar();
</script>
</body>
</html>
